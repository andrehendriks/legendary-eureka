apiVersion: v1
kind: ConfigMap
metadata:
  name: liquidsoap-config
  namespace: airadio
data:
  radio.liq: |
    set("log.stdout",true)
    music = mksafe(playlist(mode="random",reload=60,"/radio/music/playlist.m3u"))
    output.icecast(%mp3(bitrate=192),host=environment.get(default="192.168.2.5","ICECAST_HOST"),port=int_of_string(default=8000,environment.get(default="8000","ICECAST_PORT")),password=environment.get(default="","ICECAST_PASSWORD"),mount="/stream.mp3",name="AI Radio",music)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidsoap
  namespace: airadio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidsoap
  template:
    metadata:
      labels:
        app: liquidsoap
    spec:
      containers:
      - name: liquidsoap
        image: savonet/liquidsoap:v2.3.3
        command: ["liquidsoap","/etc/liquidsoap/radio.liq"]
        env:
        - name: ICECAST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airadio-runtime-secrets
              key: ICECAST_PASSWORD
        - name: ICECAST_HOST
          valueFrom:
            configMapKeyRef:
              name: airadio-endpoints
              key: ICECAST_HOST
        - name: ICECAST_PORT
          valueFrom:
            configMapKeyRef:
              name: airadio-endpoints
              key: ICECAST_PORT
        volumeMounts:
        - name: config
          mountPath: /etc/liquidsoap
          readOnly: true
        - name: music
          mountPath: /radio/music
          readOnly: true
        startupProbe:
          exec:
            command: ["sh", "-ec", "kill -0 1"]
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          exec:
            command: ["sh", "-ec", "kill -0 1"]
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["sh", "-ec", "kill -0 1"]
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: liquidsoap-config
      - name: music
        nfs:
          server: 192.168.2.5
          path: /volume1/radio/music
          readOnly: true
