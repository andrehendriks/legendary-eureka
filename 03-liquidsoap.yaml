apiVersion: v1
kind: ConfigMap
metadata:
  name: liquidsoap-config
  namespace: airadio
data:
  radio.liq: |
    set("log.stdout",true)
    Music = mksafe(playlist(id="Music",mode="random",reload=60,"/radio/playlist/playlist.m3u8"))
    settings.server.telnet.bind_addr := "0.0.0.0"
    server.telnet(port=1234)
    output.icecast(%mp3(bitrate=192),host=environment.get(default="192.168.2.5","ICECAST_HOST"),port=int_of_string(default=8030,environment.get(default="8030","ICECAST_PORT")),password=environment.get(default="","ICECAST_PASSWORD"),mount="/live",name="AI Radio",description="AI Radio - Your music, your vibe",genre="Funk, Gothic Funk, HardRock, Hardstyle, HipHop, Soul",Music)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: liquidsoap-playlist-normalizer
  namespace: airadio
data:
  normalize-playlist.sh: |
    #!/bin/sh
    set -u

    source_file=/radio/playlist-source/playlist.m3u8
    output_file=/radio/playlist/playlist.m3u8
    temporary_file=/radio/playlist/.playlist.m3u8.tmp
    category_index_dir=/radio/playlist-source/airadio-category-index
    forward_prefix='//stream-vught-nl/Dj/Music/'

    normalize_category() {
      source_name=$1
      target_name=$2
      category_name=$3
      category_source="$category_index_dir/$source_name"
      category_output="/radio/playlist/$target_name"
      category_temporary="/radio/playlist/.$target_name.tmp"

      if [ ! -r "$category_source" ]; then
        echo "Category playlist source is not readable: $category_source; retaining the last generated category playlist."
        return
      fi

      if awk -v root="$MEDIA_LIBRARY_ROOT" -v category="$category_name" '
        BEGIN {
          source_prefix = root "/" category "/"
          output_prefix = "/radio/music/Music/" category "/"
          tracks = 0
        }
        index($0, source_prefix) == 1 {
          print output_prefix substr($0, length(source_prefix) + 1)
          tracks++
        }
        END {
          if (tracks == 0) {
            print "No playable " category " tracks found in category index." > "/dev/stderr"
            exit 1
          }
          print "Normalized " tracks " " category " track(s)." > "/dev/stderr"
        }
      ' "$category_source" > "$category_temporary"; then
        mv "$category_temporary" "$category_output"
      else
        rm -f "$category_temporary"
        echo "Category playlist normalization failed for $category_name; retaining the last generated category playlist."
      fi
    }

    mkdir -p /radio/playlist
    : > "$output_file"

    while true; do
      if [ ! -r "$source_file" ]; then
        echo "Playlist source is not readable: $source_file; retaining the last generated playlist."
      elif awk -v root="$MEDIA_LIBRARY_ROOT" -v forward="$forward_prefix" '
        BEGIN { backward = "\\\\stream-vught-nl\\Dj\\Music\\"; translated = 0 }
        index($0, forward) == 1 {
          print root "/" substr($0, length(forward) + 1)
          translated++
          next
        }
        index($0, backward) == 1 {
          print root "/" substr($0, length(backward) + 1)
          translated++
          next
        }
        { print }
        END { print "Normalized " translated " playlist path(s)." > "/dev/stderr" }
      ' "$source_file" > "$temporary_file"; then
        mv "$temporary_file" "$output_file"
      else
        rm -f "$temporary_file"
        echo "Playlist normalization failed; retaining the last generated playlist."
      fi
      normalize_category "Funk.m3u8" "funk.m3u8" "Funk"
      normalize_category "Gothic-Funk.m3u8" "gothic.m3u8" "Gothic Funk"
      normalize_category "HardRock.m3u8" "hardrock.m3u8" "HardRock"
      normalize_category "Hardstyle.m3u8" "hardstyle.m3u8" "Hardstyle"
      normalize_category "HipHop.m3u8" "hiphop.m3u8" "HipHop"
      normalize_category "Soul.m3u8" "soul.m3u8" "Soul"
      sleep 60
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidsoap
  namespace: airadio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidsoap
  template:
    metadata:
      labels:
        app: liquidsoap
    spec:
      initContainers:
      - name: initialize-generated-playlist
        image: busybox:1.36
        command: ["sh", "-ec", "mkdir -p /radio/playlist && : > /radio/playlist/playlist.m3u8 && : > /radio/playlist/funk.m3u8 && : > /radio/playlist/gothic.m3u8 && : > /radio/playlist/hardrock.m3u8 && : > /radio/playlist/hardstyle.m3u8 && : > /radio/playlist/hiphop.m3u8 && : > /radio/playlist/soul.m3u8"]
        volumeMounts:
        - name: generated-playlist
          mountPath: /radio/playlist
      containers:
      - name: liquidsoap
        image: savonet/liquidsoap:v2.3.3
        command: ["liquidsoap","/etc/liquidsoap/radio.liq"]
        ports:
        - name: control
          containerPort: 1234
        env:
        - name: ICECAST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airadio-runtime-secrets
              key: ICECAST_PASSWORD
        - name: ICECAST_HOST
          valueFrom:
            configMapKeyRef:
              name: airadio-endpoints
              key: ICECAST_HOST
        - name: ICECAST_PORT
          valueFrom:
            configMapKeyRef:
              name: airadio-endpoints
              key: ICECAST_PORT
        volumeMounts:
        - name: config
          mountPath: /etc/liquidsoap
          readOnly: true
        - name: generated-playlist
          mountPath: /radio/playlist
          readOnly: true
        - name: media-library
          mountPath: /radio/library
          readOnly: true
        - name: media-library
          mountPath: /radio/music/Music
          readOnly: true
        startupProbe:
          exec:
            command: ["sh", "-ec", "kill -0 1"]
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          exec:
            command: ["sh", "-ec", "kill -0 1"]
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["sh", "-ec", "kill -0 1"]
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      - name: playlist-normalizer
        image: busybox:1.36
        command: ["sh", "/usr/local/bin/normalize-playlist.sh"]
        env:
        - name: MEDIA_LIBRARY_ROOT
          valueFrom:
            configMapKeyRef:
              name: airadio-endpoints
              key: MEDIA_LIBRARY_ROOT
        volumeMounts:
        - name: normalizer-script
          mountPath: /usr/local/bin
          readOnly: true
        - name: playlist-source
          mountPath: /radio/playlist-source
          readOnly: true
        - name: generated-playlist
          mountPath: /radio/playlist
        - name: media-library
          mountPath: /radio/library
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: liquidsoap-config
      - name: normalizer-script
        configMap:
          name: liquidsoap-playlist-normalizer
          defaultMode: 0555
      - name: playlist-source
        nfs:
          server: 192.168.2.5
          path: /volume1/radio/music
          readOnly: true
      - name: media-library
        nfs:
          server: 192.168.2.5
          path: /volume1/Dj/Music
          readOnly: true
      - name: generated-playlist
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: liquidsoap
  namespace: airadio
spec:
  type: ClusterIP
  selector:
    app: liquidsoap
  ports:
  - name: control
    port: 1234
    targetPort: control
