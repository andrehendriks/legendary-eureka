apiVersion: v1
kind: ConfigMap
metadata:
  name: liquidsoap-config
  namespace: airadio
data:
  radio.liq: |
    set("log.stdout",true)
    music = playlist(mode="random",reload=60,"/radio/music/playlist.m3u")
    output.icecast(%mp3(bitrate=192),host=getenv("ICECAST_HOST","192.168.2.5"),port=int_of_string(getenv("ICECAST_PORT","8000")),password=getenv("ICECAST_PASSWORD",""),mount="/stream.mp3",name="AI Radio",music)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidsoap
  namespace: airadio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidsoap
  template:
    metadata:
      labels:
        app: liquidsoap
    spec:
      containers:
      - name: liquidsoap
        image: savonet/liquidsoap:v2.3.3
        command: ["liquidsoap","/etc/liquidsoap/radio.liq"]
        env:
        - name: ICECAST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airadio-runtime-secrets
              key: ICECAST_PASSWORD
        - name: ICECAST_HOST
          valueFrom:
            configMapKeyRef:
              name: airadio-endpoints
              key: ICECAST_HOST
        - name: ICECAST_PORT
          valueFrom:
            configMapKeyRef:
              name: airadio-endpoints
              key: ICECAST_PORT
        volumeMounts:
        - name: config
          mountPath: /etc/liquidsoap
          readOnly: true
        - name: music
          mountPath: /radio/music
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: liquidsoap-config
      - name: music
        nfs:
          server: 192.168.2.5
          path: /volume1/radio/music
          readOnly: true
