apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- 00-namespace.yaml
- 02-ollama.yaml
- 03-liquidsoap.yaml
- radio-api.yaml
- 04-webui-gateway.yaml
- airadio-webui.yaml
replacements:
- source:
    kind: ConfigMap
    name: airadio-endpoints
    fieldPath: data.MEDIA_NFS_SERVER
  targets:
  - select:
      kind: Deployment
      name: liquidsoap
    fieldPaths:
    - spec.template.spec.volumes.[name=media-library].nfs.server
  - select:
      kind: Deployment
      name: airadio-webui
    fieldPaths:
    - spec.template.spec.volumes.[name=media-library].nfs.server
- source:
    kind: ConfigMap
    name: airadio-endpoints
    fieldPath: data.MEDIA_NFS_PATH
  targets:
  - select:
      kind: Deployment
      name: liquidsoap
    fieldPaths:
    - spec.template.spec.volumes.[name=media-library].nfs.path
  - select:
      kind: Deployment
      name: airadio-webui
    fieldPaths:
    - spec.template.spec.volumes.[name=media-library].nfs.path
